name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-rules:
    name: verify-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: python -m pip install --quiet PyYAML jsonschema
      # CI=1 skips the checks that need this Mac's launchd agent and checkout.
      - name: verify-rules.sh
        env:
          CI: "1"
        run: bash verify-rules.sh

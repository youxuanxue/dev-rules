project_root: /tmp/xuejiao-twin-fixture-project
goal: 修复登录超时后 token refresh 失败的问题
scope_in:
  - 复现登录超时后的 refresh bug
  - 修复 auth refresh 流程
  - 增加回归测试
scope_out:
  - 不重构整个 auth 系统
  - 不改 UI 样式
  - 不引入新认证框架
acceptance:
  - 有失败用例能复现 bug
  - 修复后相关测试通过
  - scripts/preflight.sh 通过
risk_policy: auto
mode: supervised-normal
agent_backend: claude-code-headless-dual-session
limits:
  max_turns: 6
  max_wall_minutes: 30
  max_budget_usd: 1.0
allowed_tools:
  supervisor:
    - Read
    - Bash(git status *)
    - Bash(git diff *)
  worker:
    - Read
    - Edit
    - Write
    - Bash(git status *)
    - Bash(git diff *)
    - Bash(npm test *)
    - Bash(./scripts/preflight.sh)
approval_policy:
  require_human_for:
    - destructive_git
    - external_side_effect
    - architecture_decision
    - security_boundary
    - dependency_change
validation_commands:
  - npm test
  - ./scripts/preflight.sh
